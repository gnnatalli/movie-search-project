<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ page_title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='/style.css') }}"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                Movie Search
            </a>
        </div>
    </nav>

    <main class="container py-5">

        {% if film %}

            <div class="card shadow-sm border-0">
                <div class="row g-0">

                    <div class="col-md-5">
                        <div class="film-detail-image">
                        <img
                            src="/static/images/movie{{ ((film[0] - 1) % 5) + 1 }}.png"
                            alt="{{ film[1] }}"
                            class="film-detail-poster"
                        >
                    </div>
                    </div>

                    <div class="col-md-7">

                        <div class="card-body p-4">

                            <h1 class="mb-3">
                                {{ film[1] }}
                            </h1>

                            <p class="text-secondary">
                                {{ film[4] }} · {{ film[3] }}
                            </p>

                            <p>
                                {{ film[2] }}
                            </p>

                            <hr>

                            <div class="row g-3 mt-2">

    <div class="col-6">
        <div class="film-info-card">
            <div class="film-info-title">
                Рейтинг
            </div>

            <div class="film-info-value">
                ⭐ {{ film[9] }}
            </div>
        </div>
    </div>

    <div class="col-6">
        <div class="film-info-card">
            <div class="film-info-title">
                Длительность
            </div>

                                <div class="film-info-value">
                                    ⏱ {{ film[7] }} мин.
                                </div>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="film-info-card">
                                <div class="film-info-title">
                                    Аренда
                                </div>

                                <div class="film-info-value">
                                    💳 ${{ film[6] }}
                                </div>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="film-info-card">
                                <div class="film-info-title">
                                    Срок аренды
                                </div>

                                <div class="film-info-value">
                                    📅 {{ film[5] }} дней
                                </div>
                            </div>
                        </div>

                    </div>

                            <p>
                                <strong>Стоимость замены:</strong>
                                ${{ film[8] }}
                            </p>

                                                    <button
                            type="button"
                            class="btn btn-primary mt-3"
                            onclick="history.back()"
                        >
                            ← Назад к результатам
                        </button>

                        </div>

                    </div>

                </div>
            </div>

        {% else %}

            <div class="alert alert-warning">
                Фильм не найден.
            </div>

            <a
                href="/"
                class="btn btn-primary"
            >
                ← Назад
            </a>

        {% endif %}

    </main>

</body>
</html>
